name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtorrent-rasterbar-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 bot.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 bot.py --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Check import sorting
        run: |
          pip install isort
          isort --check-only --diff bot.py

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy bot.py --ignore-missing-imports

      - name: Run syntax check
        run: |
          python -m py_compile bot.py

      - name: Run bot dry-run
        env:
          TELEGRAM_BOT_TOKEN: fake_token_for_testing
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          import bot
          print('Bot module imported successfully')
          print('DOWNLOAD_DIR:', bot.DOWNLOAD_DIR)
          print('MAX_FILE_SIZE_MB:', bot.MAX_FILE_SIZE_MB)
          print('BOT_TOKEN set:', bool(bot.BOT_TOKEN))
          "
